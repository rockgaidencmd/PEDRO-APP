<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionarios</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="tituloCabecera">Cuestionarios</h1>
            <p class="subtitle" id="subtituloCabecera">Elige una materia para empezar</p>
        </div>

        <div class="pantalla" id="pantallaSeleccion">
            <div class="ajustes">
                <label class="ajuste">
                    <input type="checkbox" id="ajusteAleatorio" checked>
                    Orden aleatorio
                </label>
                <label class="ajuste">
                    Preguntas por sesión
                    <select id="ajusteLimite">
                        <option value="10">10</option>
                        <option value="25" selected>25</option>
                        <option value="50">50</option>
                        <option value="0">Todas</option>
                    </select>
                </label>
            </div>
            <div class="materias" id="materias"></div>
        </div>

        <dialog id="dialogoProgreso">
            <p id="dialogoTexto"></p>
            <form method="dialog" class="dialogo-botones">
                <button class="btn btn-primary" value="continuar">Continuar</button>
                <button class="btn btn-secondary" value="reiniciar">Empezar de nuevo</button>
            </form>
        </dialog>

        <div class="pantalla" id="pantallaQuiz" hidden>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p class="progress-text"><span id="currentQuestion">1</span> de <span id="totalQuestions">0</span></p>

            <div class="quiz-container">
                <h2 class="question" id="questionText"></h2>

                <figure class="imagen-pregunta" id="imagenPregunta" hidden>
                    <img id="imagenPreguntaImg" alt="Imagen clínica de la pregunta">
                    <figcaption id="imagenPreguntaAviso" hidden>
                        Esta pregunta depende de una imagen que todavía no está disponible.
                    </figcaption>
                </figure>

                <div class="options" id="optionsContainer"></div>

                <div class="button-group">
                    <button id="prevBtn" class="btn btn-secondary" onclick="previousQuestion()">← Anterior</button>
                    <button id="nextBtn" class="btn btn-primary" onclick="nextQuestion()">Siguiente →</button>
                </div>
            </div>

            <div class="feedback" id="feedback"></div>

            <div class="pie-quiz">
                <button class="btn-enlace" onclick="volverASeleccion()">← Cambiar de materia</button>
                <button class="btn-enlace" onclick="reiniciarMateria()">Reiniciar esta materia</button>
            </div>
        </div>

        <div class="pantalla" id="pantallaResultado" hidden>
            <div class="score-container">
                <h2>¡Cuestionario completado!</h2>
                <p class="final-score" id="finalScore"></p>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="reiniciarMateria()">Repetir materia</button>
                    <button class="btn btn-secondary" onclick="volverASeleccion()">Elegir otra</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
